name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: x86_64-current
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full@sha256:c23266033da422c47d350ae3f7bb4fdfecf543cc7693a90d1f343960f9767c57
      options: --privileged
      volumes:
        - /dev:/dev
    defaults:
      run:
        shell: nu {0}
    env:
      # GitHub containers block the user namespace required by uunshare.
      XBPS_CHROOT_CMD: uchroot
    steps:
      - name: prepare void container
        shell: sh
        run: |
          set -eu
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y bash git curl sudo nushell aws-cli
          useradd -G xbuilder -M builder

      - name: checkout owned templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owned
          fetch-depth: 0
          persist-credentials: false

      - name: select changed packages
        id: changes
        working-directory: owned
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: nu .github/scripts/publish.nu changes

      - name: check signing key
        if: steps.changes.outputs.packages != ''
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: nu owned/.github/scripts/publish.nu check-key

      - name: checkout upstream build machinery
        if: steps.changes.outputs.packages != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: void-linux/void-packages
          path: void-packages
          persist-credentials: false

      - name: overlay templates and bootstrap
        if: steps.changes.outputs.packages != ''
        run: nu owned/.github/scripts/publish.nu bootstrap

      - name: build changed packages
        if: steps.changes.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: nu owned/.github/scripts/publish.nu build

      - name: collect owned binary packages
        if: steps.changes.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: nu owned/.github/scripts/publish.nu collect

      - name: restore current R2 repository
        if: steps.changes.outputs.packages != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: nu owned/.github/scripts/publish.nu restore

      - name: merge and sign repository
        if: steps.changes.outputs.packages != ''
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: nu owned/.github/scripts/publish.nu sign

      - name: publish signed repository to R2
        if: steps.changes.outputs.packages != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: nu owned/.github/scripts/publish.nu publish

      - name: record published commit after the signed index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: nu owned/.github/scripts/publish.nu record

  prune:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full@sha256:c23266033da422c47d350ae3f7bb4fdfecf543cc7693a90d1f343960f9767c57
    defaults:
      run:
        shell: nu {0}
    steps:
      - name: prepare prune container
        shell: sh
        run: |
          set -eu
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y nushell aws-cli

      - name: checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: delete stale R2 packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: nu .github/scripts/publish.nu prune
